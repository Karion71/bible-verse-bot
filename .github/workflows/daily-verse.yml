name: Send daily verse

on:
  # GitHub의 자체 schedule(cron) 트리거는 내부적으로 붐비는 대기열을 타서
  # 정각 근처엔 몇 시간까지도 밀릴 수 있다 (GitHub 공식 문서에 명시된 한계).
  # 대신 외부 크론 서비스(cron-job.org 등)가 매일 06:05 KST에 아래 이벤트를
  # API로 직접 호출하도록 한다. workflow_dispatch/repository_dispatch는
  # 그 대기열을 타지 않아 거의 즉시 실행된다.
  repository_dispatch:
    types: [send-verse]
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send verse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_GID: ${{ secrets.GOOGLE_SHEET_GID }}
        run: python send_verse_scheduled.py
