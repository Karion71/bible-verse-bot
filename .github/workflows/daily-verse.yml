name: Send daily verse

on:
  schedule:
    # 매일 06:05 KST = 전날 21:05 UTC. 정각(0분)은 다른 워크플로우들과 몰려서
    # 더 밀리는 경향이 있어 5분으로 살짝 비켜둔다. (그래도 GitHub 무료 cron 특성상
    # 몇 분~드물게 1시간 이상 지연될 수 있음, 정확한 시각 보장은 안 됨)
    - cron: "5 21 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send verse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_GID: ${{ secrets.GOOGLE_SHEET_GID }}
        run: python send_verse_scheduled.py
